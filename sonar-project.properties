# SonarCloud — alcance del analisis.
# Este repo es ESPEJO del servidor web (C:\inetpub\wwwroot\muhle-vct) mas los
# scripts de entrega. La mayor parte NO es codigo que se escriba o mantenga aca:
#   - db/objetos/**  = definiciones volcadas de la base (deben coincidir con el
#                      servidor; no se editan).
#   - css/**, js/**  = espejo de los assets del servidor + librerias de terceros
#                      (sweetalert2, font-awesome, w3, y los vct-* grandes).
# Analizarlos dispara duplicacion y falsos positivos de seguridad/fiabilidad que
# no se pueden "corregir" sin apartar el repo del servidor. Por eso se excluyen.
sonar.projectKey=mrtinaja_muhle-vct
sonar.organization=mrtinaja

sonar.exclusions=db/objetos/**,db/_dump/**,css/**,js/**,**/*.min.js,**/*.min.css,**/*.sql
sonar.cpd.exclusions=db/objetos/**,**/*.sql
